<title>어땠을까</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 시험지 카드 구조는 그대로. 학년마다 색이 바뀌고(고1 연두 → 고2 하늘 → 고3 보라 → 입시 주황 → 대학 코랄 → 서른 금색),
   방금 한 선택이 좋았는지·아쉬웠는지·보통이었는지에 따라 화면 분위기 색(mood)이 바뀐다. 상황마다 짧은 그림 영상이 붙는다. */
:root {
  --base: #f8faff; --sheet: #ffffff; --ink: #1c2130; --muted: #687085; --rule: #e4e8f2;
  --accent: #2fd39a; --accent2: #ffc93c;
  --on: #16203a;   /* 밝은 메인 색 위의 글자 */
  --accent-ink: color-mix(in srgb, var(--accent) 58%, #0f1630);   /* 밝은 바탕 위에 메인 색으로 쓰는 글자 */
  --good: #12a564; --bad: #e5483d; --normal: #7d879b;
  --mood: var(--accent);
  --omr: var(--accent);
  --omr-soft: color-mix(in srgb, var(--accent) 13%, var(--sheet));
  --paper: color-mix(in srgb, var(--accent) 10%, var(--base));
  --hl: color-mix(in srgb, var(--accent2) 45%, transparent);
  --red: #e5483d; --red-soft: color-mix(in srgb, #e5483d 14%, var(--sheet));
  --good-soft: color-mix(in srgb, var(--good) 13%, var(--sheet));
  --warn: #c27a0e; --warn-soft: color-mix(in srgb, #f5a524 16%, var(--sheet));
  --bad-soft: color-mix(in srgb, var(--bad) 13%, var(--sheet));
  --shadow: 0 1px 0 rgba(28,33,48,.04), 0 10px 30px -14px color-mix(in srgb, var(--accent) 45%, rgba(28,33,48,.4));
  --f-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-hand: "Gaegu", "Gowun Dodum", cursive;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --base: #0f1118; --sheet: #181b25; --ink: #eceef4; --muted: #a0a7b8; --rule: #2a2f3d; --good: #3ad48b; --bad: #ff6a5f; --normal: #9aa3b6; --warn: #f0b04a; --accent-ink: var(--accent); color-scheme: dark; } }
:root[data-theme="dark"] { --base: #0f1118; --sheet: #181b25; --ink: #eceef4; --muted: #a0a7b8; --rule: #2a2f3d; --good: #3ad48b; --bad: #ff6a5f; --normal: #9aa3b6; --warn: #f0b04a; --accent-ink: var(--accent); color-scheme: dark; }
:root[data-phase="g1"]  { --accent: #2fd39a; --accent2: #ffc93c; }
:root[data-phase="g2"]  { --accent: #4aa8ff; --accent2: #3fe0e8; }
:root[data-phase="g3"]  { --accent: #a68bff; --accent2: #ff8cc6; }
:root[data-phase="adm"] { --accent: #ff9d52; --accent2: #ffd84d; }
:root[data-phase="col"] { --accent: #ff7fa6; --accent2: #b49bff; }
:root[data-phase="end"] { --accent: #f7c52b; --accent2: #ff7fa6; }
:root[data-mood="good"]   { --mood: var(--good); }
:root[data-mood="bad"]    { --mood: var(--bad); }
:root[data-mood="normal"] { --mood: var(--normal); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { word-break: keep-all; overflow-wrap: anywhere; margin: 0; background: radial-gradient(1200px 520px at 50% -160px, color-mix(in srgb, var(--mood) 26%, transparent), transparent 70%), var(--paper); background-repeat: no-repeat; transition: background .6s ease; color: var(--ink); font: 16px/1.75 var(--f-body); letter-spacing: 0; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--omr); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 400 24px/1 var(--f-display); color: var(--ink); letter-spacing: -.02em; background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 2px; }
.brand b { white-space: nowrap; }
.brand span { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .brand span { display: none; } }
.ghost { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* 시트 */
.sheet { background: var(--sheet); border-radius: var(--r); box-shadow: var(--shadow); position: relative; }
.sheet.omr { border-left: 0; border-top: 4px solid var(--accent); }

.pad { padding: 22px 22px; }
@media (max-width: 560px) { .pad { padding: 18px 16px; } }

/* 시작 화면 */
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: stretch; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font: 400 46px/1.18 var(--f-display); letter-spacing: 0; word-break: keep-all; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); }
.hero p.lead { font-size: 17px; color: var(--muted); max-width: 34em; margin: 14px 0 22px; }
.ticket { display: grid; gap: 0; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; font-size: 13px; }
.ticket .row { display: grid; grid-template-columns: 92px 1fr; border-top: 1px solid var(--rule); }
.ticket .row:first-child { border-top: 0; }
.ticket .k { background: var(--paper); color: var(--muted); font-weight: 700; padding: 9px 10px; border-right: 1px solid var(--rule); }
.ticket .v { padding: 9px 12px; min-width: 0; }
.ticket .head { background: var(--ink); color: var(--sheet); padding: 10px 12px; font: 400 17px/1.2 var(--f-display); letter-spacing: .04em; display: flex; justify-content: space-between; }
.cta { display: inline-flex; align-items: center; gap: 8px; background: var(--omr); color: var(--on); border: 0; border-radius: 8px; padding: 13px 22px; font-weight: 700; font-size: 16px; }
.cta:hover { filter: brightness(1.06); }
.cta.secondary { background: var(--ink); color: var(--sheet); }
.cta:disabled { opacity: .45; cursor: not-allowed; }
.feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
@media (max-width: 680px) { .feat { grid-template-columns: 1fr; } }
.feat div { border-top: 2px solid var(--ink); padding-top: 10px; font-size: 14px; color: var(--muted); }
.feat b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }

/* 설정 화면 */
.steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.steps button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.steps button.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.form { display: grid; gap: 20px; }
.field { display: grid; gap: 8px; align-content: start; }
.grid2 { align-items: start; }
.field > label, .field > .lab { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
@media (max-width: 680px) { .grid2 { grid-template-columns: 1fr; } }
input[type=text], input[type=number], select { width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font: inherit; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.seg button.on { border-color: var(--omr); background: var(--omr-soft); color: var(--accent-ink); font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cards button { text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.cards button b { display: block; color: var(--ink); font-size: 14px; }
.cards button.on { border-color: var(--omr); background: var(--omr-soft); }
.cards button.on b { color: var(--accent-ink); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 480px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
.sub { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.slider { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; }
.bubbles { display: flex; gap: 6px; flex-wrap: wrap; }
.bubbles button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--omr); background: transparent; color: var(--accent-ink); font: 600 13px var(--f-num); }
.bubbles button.on { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.bubbles .ends { font-size: 12px; color: var(--muted); align-self: center; }
.formnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* 게임 화면 */
.ruler { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 16px; }
.ruler div { font-size: 12px; color: var(--muted); padding-top: 6px; border-top: 4px solid var(--rule); text-align: center; }
.ruler div.done { border-color: var(--ink); color: var(--ink); }
.ruler div.now { border-color: var(--omr); color: var(--accent-ink); font-weight: 700; }
.game { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: 1fr; } }
.status { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .status { position: static; order: 2; } }
.status h3 { font: 400 22px/1.2 var(--f-display); }
.status .who { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.score { border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 10px; }
.score .k { font-size: 11.5px; color: var(--muted); }
.score .g { font: 600 22px/1.1 var(--f-num); }
.score .g small { font: 500 11px var(--f-body); color: var(--muted); margin-left: 3px; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 86px 1fr 28px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .track { height: 7px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink); border-radius: 4px; transition: width .4s ease; }
.bar.badv .fill { background: var(--red); }
.bar .v { font: 500 12px var(--f-num); text-align: right; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; color: var(--muted); }
.chip b { color: var(--ink); font-weight: 600; }

.feed { display: grid; gap: 8px; margin-bottom: 14px; }
.note { padding: 10px 14px; border-radius: 8px; background: var(--paper); font-size: 14px; border-left: 3px solid var(--rule); }
.note.good { background: var(--good-soft); border-color: var(--good); }
.note.warn { background: var(--warn-soft); border-color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: var(--bad); }
.note .t { font-size: 11.5px; color: var(--muted); display: block; }
@media (prefers-reduced-motion: no-preference) { .note.fresh { animation: rise .35s ease both; } @keyframes rise { from { transform: translateY(6px); opacity: .4; } } }

.q { padding: 22px; }
.q .qno { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.q .qno span.badge { font: 600 12px var(--f-num); background: var(--ink); color: var(--sheet); border-radius: 4px; padding: 2px 7px; }
.q .qno span.when { font-size: 13px; color: var(--muted); }
.q h2 { font: 400 27px/1.3 var(--f-display); letter-spacing: -.02em; margin-bottom: 10px; }
.q p.ctx { font-size: 16px; line-height: 1.8; }
.opt .txt { display: grid; gap: 2px; }
.opt .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.q p.ctx { margin: 0 0 16px; max-width: 46em; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 11px 14px; font-size: 15px; }
.opt:hover { border-color: var(--omr); }
.opt .bub { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--omr); display: grid; place-items: center; color: var(--accent-ink); font: 600 12px var(--f-num); }
.opt:hover .bub { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.alloc { display: grid; gap: 8px; }
.arow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border-bottom: 1px dashed var(--rule); padding-bottom: 8px; }
.arow .nm b { display: block; font-size: 15px; }
.arow .nm span { font-size: 12.5px; color: var(--muted); }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); font-size: 18px; line-height: 1; }
.step button:disabled { opacity: .35; cursor: default; }
.step .val { width: 26px; text-align: center; font: 600 17px var(--f-num); }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 14px 0 6px; }
.subj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: -6px 0 14px; }
.subj .sg { border-radius: 6px; padding: 5px 0; text-align: center; background: color-mix(in srgb, var(--c) 12%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.subj .sg span { display: block; font-size: 11px; color: var(--muted); }
.subj .sg b { font: 600 18px var(--f-num); color: var(--c); }
.cells i { height: 26px; border-radius: 4px; border: 1.5px solid var(--omr); display: grid; place-items: center; font: 600 10.5px var(--f-body); font-style: normal; color: var(--sheet); overflow: hidden; white-space: nowrap; }
.cells i.empty { background: transparent; }
.left { font-size: 13px; color: var(--muted); }
.qactions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.banner { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--ink); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; margin-bottom: 12px; }
details.past { margin-top: 14px; }
details.past summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.past .feed { margin-top: 8px; max-height: 360px; overflow: auto; }

/* 결과 화면 */
.report { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
@media (max-width: 860px) { .report { grid-template-columns: 1fr; } }
.report h1 { font: 400 34px/1.25 var(--f-display); letter-spacing: 0; margin: 6px 0 6px; }
.report h1 span { background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); }
.report .job { font-size: 18px; font-weight: 600; }
.report .sub { color: var(--muted); }
.story { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.story li { padding-left: 14px; position: relative; }
.story li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--omr); }
.gradebook { width: 100%; border-collapse: collapse; font-size: 14px; }
.gradebook th, .gradebook td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; }
.gradebook th { background: transparent; color: var(--muted); font-weight: 500; width: 30%; }
.gradebook td.g { font: 34px/1 var(--f-hand); color: var(--red); width: 70px; text-align: center; }
.meta { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 30px 0 12px; flex-wrap: wrap; }
.sectionhead h2 { font: 400 28px/1.2 var(--f-display); letter-spacing: -.02em; }
.sectionhead p { margin: 0; color: var(--muted); font-size: 14px; }
.wrong { display: grid; gap: 12px; }
.wcard { display: grid; grid-template-columns: 54px 1fr; gap: 0; overflow: hidden; }
.wcard .mark { background: var(--red-soft); color: var(--red); display: grid; place-items: center; font: 54px/1 var(--f-hand); border-right: 1px dashed var(--rule); }
.wcard.goodc .mark { background: var(--good-soft); color: var(--good); }
.wcard .body { padding: 16px 18px; min-width: 0; }
.wcard .when { font-size: 12.5px; color: var(--muted); }
.wcard h3 { font-size: 17px; margin: 2px 0 10px; }
.ans { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: 14px; }
.ans .k { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
.ans .mine { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.goodc .ans .mine { text-decoration: none; }
.result { margin-top: 10px; background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.delta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.delta span { font: 600 12px var(--f-num); border-radius: 4px; padding: 2px 7px; }
.delta .up { background: var(--good-soft); color: var(--good); }
.delta .down { background: var(--bad-soft); color: var(--bad); }
.wcard .redo { margin-top: 10px; }
.small { font-size: 13px; }
.muted { color: var(--muted); }
.timeline { display: grid; gap: 6px; }
.computing { padding: 18px; color: var(--muted); }
.endactions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 9; }
/* 짧은 영상(움직이는 그림) */
.clip { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: #1d2550; margin: -4px 0 18px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  --sc-sky: #8fd3ff; --sc-sunset: #ffb38a; --sc-night: #1f2757; --sc-wall: #fff2dc; --sc-wallN: #2b3058; --sc-wallWarm: #ffe6cf; --sc-wallCool: #e5efff; --sc-floor: #d8bf9c;
  --sc-wood: #c98a55; --sc-wood2: #9c6438; --sc-frame: #c7d0e2; --sc-sheet: #ffffff; --sc-ink: #1d2230; --sc-line: #d7dce6; --sc-muted: #b8c0d4; --sc-skin: #ffd7b8; --sc-hair: #2b2230;
  --sc-pants: #3b4a6b; --sc-accent: var(--accent); --sc-accent2: var(--accent2); --sc-glow: #bfe6ff; --sc-bed: #8fb0e8; --sc-road: #3a3f52; --sc-bldg: #c5d3ea; --sc-bldgN: #30386a;
  --sc-door: #8a5a3a; --sc-army: #5d7a3a; --sc-labcoat: #f4f6fa; }
.clip svg, .clip video { display: block; width: 100%; height: 100%; object-fit: cover; }
.clip .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px; background: linear-gradient(transparent, rgba(10,12,24,.72)); color: #fff; font-size: 14px; line-height: 1.5; }
.clip .cap b { display: inline-block; font-size: 11px; letter-spacing: .08em; background: var(--accent); color: var(--on); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.clip .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(255,255,255,.2); }
.clip .bar i { display: block; height: 100%; width: 100%; background: var(--accent2); transform-origin: left; animation: prog 6s linear infinite; }
.clip .pp { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(10,12,24,.55); color: #fff; font-size: 13px; display: grid; place-items: center; }

function gradeOfTurn(t) { return t < 4 ? 1 : t < 8 ? 2 : 3; }
function startLabel(f) { const g = gradeOfTurn(+f.startTurn || 0); const w = OPT.when[g].find(x => x[0] === +f.startTurn); return `고${g} ${w ? w[1] : ''}`; }
function fillDefaults(f) {
  if (!f.acad) { const n = +f.academies || 0; f.acad = {}; ['kor', 'math', 'eng', 'inq'].forEach((k, i) => { f.acad[k] = i < n ? 'big' : 'none'; }); }
  const d = { startTurn: (+f.grade - 1 || 0) * 4, pastMock: 'casual', subject: 'soc', subj: { kor: f.mockG || 3, math: f.mockG || 3, eng: f.mockG || 3, inq: f.mockG || 3 }, pJob: 'office', pBond: 'good', romanceNow: 'none', screen: 2, academies: 1, clarity: 2 };
  Object.keys(d).forEach(k => { if (f[k] == null) f[k] = d[k]; });
  f.grade = gradeOfTurn(+f.startTurn);
  return f;
}

function mockAvg(f) { const s = f.subj; return s ? Math.round((+s.kor + +s.math + +s.eng + +s.inq) / 4 * 10) / 10 : f.mockG; }
function profileOf(f) {
  const five = +f.grade < 3;

  return Object.assign({}, f, { gpaPct: gradeToPct(f.gpaG, five), mockPct: gradeToPct(mockAvg(f), false), startTurn: st, grade: gradeOfTurn(st), subject: st > 2 ? f.subject : null });
}

function seg(name, opts, val) {
  return `<div class="seg" role="group">` + opts.map(([v, l]) => `<button type="button" data-set="${name}" data-v="${esc(v)}" class="${String(val) === String(v) ? 'on' : ''}">${esc(l)}</button>`).join('') + `</div>`;
}
function bubbles(name, val, lo, hi) {
  let h = `<div class="bubbles" role="group"><span class="ends">${esc(lo)}</span>`;
  for (let i = 1; i <= 5; i++) h += `<button type="button" data-set="${name}" data-v="${i}" data-num="1" class="${+val === i ? 'on' : ''}" aria-label="${esc(name)} ${i}">${i}</button>`;
  return h + `<span class="ends">${esc(hi)}</span></div>`;
}

    </div>
  </section>

  <div class="sectionhead"><h2>인생 오답노트</h2><p>${an ? `내가 고른 ${s.history.length}개 답 중 다른 답 ${an.tried}개를 같은 운으로 다시 살아 봤습니다. 그중 ${an.changed}개가 서른 살을 바꿨습니다.` : '같은 운으로 다른 답을 하나씩 다시 살아 보는 중…'}</p></div>
  <div class="wrong" id="wrong">${an ? (an.regrets.length ? an.regrets.map(x => card(x, false)).join('') : '<div class="sheet pad muted">바꿨을 때 더 나아지는 답을 찾지 못했습니다. 이번 인생은 거의 최선의 답을 골랐습니다.</div>') : '<div class="sheet computing">계산 중…</div>'}</div>

  ${an && an.goods.length ? `<div class="sectionhead"><h2>잘 고른 답</h2><p>다른 답을 골랐다면 더 나빠졌을 순간들</p></div><div class="wrong">${an.goods.map(x => card(x, true)).join('')}</div>` : ''}

  <div class="sectionhead"><h2>지나온 시간</h2><p>${s.log.length}줄의 기록</p></div>
  <details class="sheet pad"><summary class="small" style="cursor:pointer">고1부터 서른까지 전체 기록 펼치기</summary><div class="timeline" style="margin-top:12px">${s.log.map(l => `<div class="note ${l.kind}"><span class="t">${esc(l.t)}</span>${esc(l.text)}</div>`).join('')}</div></details>`;

  setTheme('end', e.satTag === 'happy' ? 'good' : e.satTag === 'regret' ? 'bad' : 'normal');
  const es = SC.sceneForCareer(e, (s.career && s.career.field) || 'none');
  mountClip('endClip', 'end:' + e.code, clipHTML(es, `<b>서른 살</b>${esc(e.career)}`, 'AGE 30'));
  document.getElementById('againSame').onclick = () => { startGame(); window.scrollTo(0, 0); };
  document.getElementById('editMe').onclick = () => { app.screen = 'setup'; app.step = 0; render(); };
  document.getElementById('copyRes').onclick = () => {
    const txt = `[어땠을까] ${e.archetype}\n${e.uni} ${e.major}\n서른 살: ${e.career} (연 ${money(e.salary)})\n` + e.story.join('\n') +
      (an && an.regrets[0] ? `\n가장 아쉬운 선택: ${an.regrets[0].turn} "${an.regrets[0].title}" — ${an.regrets[0].alt} → ${an.regrets[0].ending.career}` : '');
    const done = () => toast('결과를 복사했어요');
    try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt)); } catch (err) { fallbackCopy(txt); }
  };
  $app.querySelectorAll('[data-rewind]').forEach(b => { b.onclick = () => rewind(+b.dataset.rewind); });
  if (!an) setTimeout(() => {
    try { app.analysis = CS.analyze(profileOf(app.form), app.seed, s.history, e); } catch (err) { console.error(err); app.analysis = { regrets: [], goods: [], tried: 0, changed: 0 }; }
    if (app.screen === 'end') render();
  }, 30);
}
function fallbackCopy(txt) {
  const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('결과를 복사했어요'); } catch (e) { toast('복사가 막혀 있어요. 직접 선택해 복사해 주세요'); }
  ta.remove();
}
function rewind(idx) {
  const h = app.res.state.history;
  const d = {};
  h.slice(0, idx).forEach(x => { d[x.key] = x.choice; });
  app.decisions = d; app.rewinds++; app.rewindFrom = h[idx].turn + ' · ' + h[idx].title;
  app.analysis = null; app.endingSaved = false; app.seenLog = 0;
  app.screen = 'game';
  app.res = CS.play(profileOf(app.form), app.seed, app.decisions);
  app.seenLog = Math.max(0, app.res.state.log.length - 3);
  render(); window.scrollTo(0, 0);
}

function render() {
  document.getElementById('homeBtn').hidden = app.screen === 'intro';
  if (app.screen !== 'intro') clearInterval(app.trTimer);
  if (app.screen === 'setup') setTheme(PHASE_KEYS[Math.min(2, Math.floor((+app.form.startTurn || 0) / 4))], null);
  if (app.screen === 'intro') renderIntro();
  else if (app.screen === 'setup') renderSetup();
  else if (app.screen === 'game') renderGame();
  else renderEnd();
}
document.getElementById('homeBtn').onclick = () => { app.screen = 'intro'; render(); window.scrollTo(0, 0); };
// 소리 켜고 끄기 — 브라우저는 첫 터치 뒤에야 소리를 허락한다
const musicBtn = document.getElementById('musicBtn'), sfxBtn = document.getElementById('sfxBtn');
function sndLabels() { musicBtn.setAttribute('aria-pressed', AU.music ? 'true' : 'false'); sfxBtn.setAttribute('aria-pressed', AU.effects ? 'true' : 'false'); musicBtn.title = AU.music ? '음악 끄기' : '음악 켜기'; sfxBtn.title = AU.effects ? '효과음 끄기' : '효과음 켜기'; }
sndLabels();
musicBtn.onclick = () => { AU.toggleMusic(); sndLabels(); };
sfxBtn.onclick = () => { AU.toggleSfx(); sndLabels(); AU.sfx('tap'); };
document.addEventListener('pointerdown', () => AU.unlock(), { capture: true });
document.addEventListener('keydown', () => AU.unlock(), { capture: true });
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled || b.classList.contains('snd')) return;
  if (b.dataset.opt) AU.sfx('select');
  else if (b.dataset.inc) AU.sfx('plus');
  else if (b.dataset.dec) AU.sfx('minus');
  else if (b.id === 'allocGo' || b.id === 'methGo' || b.id === 'nextStep' || b.id === 'goSetup' || b.id === 'goQuick') AU.sfx('select');
  else AU.sfx('tap');
}, { capture: true });

// 화면이 새로 배포돼도 진행 중인 게임은 이어서
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ screen: app.screen, step: app.step, form: app.form, seed: app.seed, decisions: app.decisions, seenLog: app.seenLog, rewinds: app.rewinds }));
function boot(data) {
  if (data && data.form) {
    Object.assign(app, { screen: data.screen, step: data.step || 0, form: data.form, seed: data.seed, decisions: data.decisions || {}, seenLog: data.seenLog || 0, rewinds: data.rewinds || 0 });
    if ((app.screen === 'game' || app.screen === 'end') && app.seed) { app.res = CS.play(profileOf(app.form), app.seed, app.decisions); app.screen = app.res.done ? 'end' : 'game'; }
  }
  render();
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
})();
</script>
